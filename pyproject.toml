[project]
name = "local-meeting-minutes"
version = "0.1.0"
description = "로컬 CPU 전사 및 근거 기반 한글 회의록"
requires-python = ">=3.12,<3.13"
dependencies = [
  "whisperx==3.8.6",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
  "torchcodec==0.7.0",
  "jsonschema>=4.23,<5",
  "psutil>=7,<8",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.1",
  "alembic==1.20.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "yt-dlp==2026.8.19",
  "yt-dlp-ejs==0.8.0",
  "google-genai==2.25.0",
]

[tool.uv]
package = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]
preflight = [
    "yt-dlp==2026.8.19",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_minutes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: 로컬 프로세스·미디어 통합", "model: 실제 CPU 모델", "live_codex: 실제 구독 호출", "slow: 장시간 시험"]
addopts = "-m 'not model and not live_codex and not slow'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
